#%Validation Profile 1.0
profile: A2A Agent Card Best Practices
warning:
  - card-capabilities-required
  - card-description-required
  - card-name-required
  - card-provider-required
  - card-url-required
validations:
  card-url-required:
    message: |
      Agent Card must include a valid endpoint URL. Add a complete URL that specifies where the agent can be accessed to enable proper communication and integration with other services.
    targetClass: sfdc.A2A
    and:
      - propertyConstraints:
          sfdc.planner / sfdc.a2aCard / sfdc.url:
            minLength: 1
      - propertyConstraints:
          sfdc.planner / sfdc.a2aCard / sfdc.url:
            minCount: 1
  card-provider-required:
    message: |
      Agent Card must include complete provider information. Add a provider section with both organization name and URL to clearly identify the agent's owner and enable proper attribution and support.
    targetClass: sfdc.A2A
    if:
      propertyConstraints:
        sfdc.planner / sfdc.a2aCard / sfdc.provider:
          minCount: 1
    then:
      and:
        - propertyConstraints:
            sfdc.planner / sfdc.a2aCard / sfdc.provider / sfdc.organization:
              minLength: 1
        - propertyConstraints:
            sfdc.planner / sfdc.a2aCard / sfdc.provider / sfdc.organization:
              minCount: 1
        - propertyConstraints:
            sfdc.planner / sfdc.a2aCard / sfdc.provider / sfdc.url:
              minLength: 1
        - propertyConstraints:
            sfdc.planner / sfdc.a2aCard / sfdc.provider / sfdc.url:
              minCount: 1
  card-name-required:
    message: |
      Agent Card must include a meaningful name property. Add a clear, descriptive name that identifies the agent's purpose and makes it easily recognizable for users and administrators.
    targetClass: sfdc.A2A
    and:
      - propertyConstraints:
          sfdc.planner / sfdc.a2aCard / sfdc.name:
            minLength: 1
      - propertyConstraints:
          sfdc.planner / sfdc.a2aCard / sfdc.name:
            minCount: 1
  card-description-required:
    message: |
      Agent Card must include a meaningful description property. Add a clear, non-empty description that explains the agent's purpose, capabilities, and intended use cases to help users understand its functionality.
    targetClass: sfdc.A2A
    and:
      - propertyConstraints:
          sfdc.planner / sfdc.a2aCard / sfdc.description:
            minLength: 1
      - propertyConstraints:
          sfdc.planner / sfdc.a2aCard / sfdc.description:
            minCount: 1
  card-capabilities-required:
    message: |
      Agent Card must define all required capability properties in the capabilities section. Add streaming, pushNotifications, and stateTransitionHistory properties to clearly communicate agent functionality and integration requirements.
    targetClass: sfdc.A2A
    and:
      - propertyConstraints:
          sfdc.planner / sfdc.a2aCard / sfdc.capabilities / sfdc.streaming:
            minCount: 1
      - propertyConstraints:
          sfdc.planner / sfdc.a2aCard / sfdc.capabilities / sfdc.pushNotifications:
            minCount: 1
      - propertyConstraints:
          sfdc.planner / sfdc.a2aCard / sfdc.capabilities / sfdc.stateTransitionHistory:
            minCount: 1