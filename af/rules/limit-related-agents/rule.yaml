#%Validation Profile 1.0
profile: MuleSoft Agent Fabric Validation
warning:
  - no-actions
validations:
  no-actions:
    message: |
      Agent has too many agent links defined. Limit the number of links to 10 or fewer to maintain optimal performance and reduce management complexity.
    targetClass: sfdc.Agent
    propertyConstraints:
      sfdc.relatedAgents:
        maxCount: 10