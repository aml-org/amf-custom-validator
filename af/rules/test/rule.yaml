#%Validation Profile 1.0

profile: Agent Testing Best Practices
description: Best practices regarding the testing of registered agents using Testing Center capabilities

tags:
  - testing

warning:
  - failed-tests
  - no-test-suites
  - test-suites-never-passed

validations:
  failed-tests:
    message: "Agents should not have failing tests\n"
    targetClass: "sfdc.Agent"
    propertyConstraints:
      sfdc.testing / sfdc.totalFailedTests:
        maxInclusive: 0
  no-test-suites:
    message: "Agent has no test-suites associated\n"
    targetClass: "sfdc.Agent"
    propertyConstraints:
      sfdc.testing / sfdc.hasTestSuites:
        in:
          - true
  test-suites-never-passed:
    message: "Agent associated test suites must have been runned at least once\n"
    targetClass: "sfdc.Agent"
    not:
      propertyConstraints:
        sfdc.testing / sfdc.lastTestRun:
          in:
            - "Never"